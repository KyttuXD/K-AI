[package]
name = "kyttu-ai"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
scraper = "0.24"
rfd = "0.15"
dirs = "6"
similar = "2"
tempfile = "3"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "native_tls_backend", "voice"] }
# Discord voice for the bot Music tool. Default features stay off: they turn on rustls (serenity rustls_backend).
# "native" keeps every TLS stack on native-tls; "tungstenite" is the voice websocket backend the driver needs.
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "serenity", "native", "tungstenite", "builtin-queue"] }
# songbird brings symphonia without codecs: WebM (mkv), M4A (isomp4 + aac), MP3 and Ogg/Vorbis. Opus is songbird's own.
symphonia = { version = "0.5", default-features = false, features = ["mkv", "isomp4", "aac", "mp3", "ogg", "vorbis"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
notify = "8"
pdf-extract = "0.12"
# DOCX reading only: inflate through flate2/zlib-rs, without the zopfli encoder that "deflate" adds.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# extract.rs uses the 0.41 API (events deref to bytes; 0.42 moved them to str).
quick-xml = "0.41"
# v1: the native stores (Windows Credential Manager, macOS Keychain, Secret Service over zbus in pure Rust).
keyring = { version = "4", default-features = false, features = ["v1"] }
base64 = "0.23"
# Icon font (regular weight only) for the UI's buttons and tabs. 0.11 is the release for egui 0.33; its eframe is a dev-dependency only.
egui-phosphor = { version = "0.11", default-features = false, features = ["regular"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Headless UI tests (src/ui): AccessKit tree, no GPU or window. Keep its version in step with eframe.
egui_kittest = { version = "0.33", default-features = false, features = ["eframe"] }

# Published builds (release.yml, scripts/package.*): smaller and faster, at the cost of a slower final link.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# CI builds (build.yml): `cargo test --profile ci` and the test packages from `cargo build --profile ci` share one build
# of the dependencies, so each run compiles them once (and not at all on a warm cache). The app crate is barely
# optimised (it is rebuilt every run); dependencies are, so the uploaded test builds stay responsive. Line tables keep
# file and line in crash.log backtraces without full debug info.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 2
