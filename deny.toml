# cargo-deny (https://embarkstudios.github.io/cargo-deny/): run by build.yml (pushes, pull requests, weekly) and
# release.yml. Run locally with `cargo deny check`.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates fail the check only when this crate depends on them directly; transitive ones are reported
# by the weekly run's log and fixed through the dependency that pulls them in.
unmaintained = "workspace"
# Add an advisory here only with a comment saying why it does not affect this app and when to drop it.
ignore = [
    # Drop when hpke-rs (via songbird's DAVE support) moves to libcrux-sha3 >= 0.0.10.
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 pinned by hpke-rs via songbird DAVE; incremental SHAKE squeeze unused" },
    # Drop with RUSTSEC-2026-0207 above (same crate, same fix).
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 pinned by hpke-rs via songbird DAVE; AVX2 x4 shake256 unused" },
    # Drop when songbird allows ringbuf >= 0.5.2.
    { id = "RUSTSEC-2026-0293", reason = "songbird 0.6.1 needs ringbuf ^0.4; buffered samples have no panicking Drop" },
    # Drop when hpke-rs-rust-crypto (via songbird's DAVE support) allows crypto-bigint >= 0.7.6.
    { id = "RUSTSEC-2026-0212", reason = "crypto-bigint 0.5.5 pinned via hpke-rs-rust-crypto for DAVE voice key agreement; the aarch64 constant-time swap issue is local timing only, with no remote secret oracle" },
    # Drop when the voice stack allows libcrux-secrets >= 0.0.6.
    { id = "RUSTSEC-2026-0387", reason = "libcrux-secrets 0.0.5 pinned via hpke-rs for DAVE voice encryption; timing variability needs local measurement, no remote secret oracle in this app" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The app itself is not published (publish = false), so it needs no license field here.
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions are common in GUI stacks (windows-sys, bitflags); warn, do not fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
