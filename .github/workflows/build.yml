name: Build
# Every push to main and every pull request (docs-only changes skip it), plus a weekly dependency audit.
# lint: fmt and clippy, once, on Linux. deny: cargo-deny (advisories, licenses, sources), also weekly.
# native: tests on each system, in the ci profile (Cargo.toml). Pull requests test Windows, Linux x64 and Apple
# Silicon and stop there; main and manual runs also test Linux ARM64 and Intel macOS, then build the package from the
# same profile (the test build's dependencies are reused) with llama-server bundled, and upload it. Each job's summary
# shows the test time and, when packaged, the binary and package sizes, then a table of how long each step took.
# Pushes to main also publish the zips to the rolling "nightly" pre-release (scripts/nightly.sh), and publish-checksums
# adds SHA256SUMS.txt and the "commit: <sha>" line the in-app updater reads. Pull requests never publish.
# Rust caches are saved by main's runs only; pull requests read them (GitHub scopes caches by branch).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore', '.gitattributes', '.github/dependabot.yml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.gitignore', '.gitattributes', '.github/dependabot.yml']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request or branch replaces its running build; main's runs all finish (they save caches).
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  # Incremental files are never reused on a fresh runner; they only slow the build and bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  # Discord voice (songbird > opus2 > libopus_sys): build the libopus sources shipped in that crate with CMake and link
  # them statically, so no system libopus is needed or bundled (on Linux, pkg-config would otherwise pick up a runner's
  # libopus-dev). CMake takes the macOS minimum from each job's MACOSX_DEPLOYMENT_TARGET (ld warns if an object
  # targets a newer macOS).
  LIBOPUS_BUNDLED: '1'
jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml names the version and components.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cmake pkg-config libssl-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: '1.99.1'

  native:
    if: github.event_name != 'schedule'
    # contents: write is for the nightly upload step below, which runs on pushes to main only (NIGHTLY). The token is
    # handed to that step alone and checkout does not keep it; pull requests from forks only ever get read access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: one system of each kind. main and manual runs: all five release targets.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"artifact":"windows-x64","os":"windows-2025"},{"artifact":"linux-x64","os":"ubuntu-24.04"},{"artifact":"macos-arm64","os":"macos-15","macos_min":"11.0"}]' || '[{"artifact":"windows-x64","os":"windows-2025"},{"artifact":"linux-x64","os":"ubuntu-24.04"},{"artifact":"linux-arm64","os":"ubuntu-24.04-arm"},{"artifact":"macos-x64","os":"macos-15-intel","macos_min":"10.13"},{"artifact":"macos-arm64","os":"macos-15","macos_min":"11.0"}]') }}
    runs-on: ${{ matrix.os }}
    # 90: a cache miss on Intel macOS also builds llama-server with every CPU variant.
    timeout-minutes: 90
    env:
      KYTTU_PROFILE: ci
      KYTTU_ARTIFACT: ${{ matrix.artifact }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
      PACKAGE: ${{ github.event_name != 'pull_request' }}
      # Only a push to main publishes the rolling "nightly" pre-release (scripts/nightly.sh).
      NIGHTLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # Build-times table: each mark appends "name, cache hit, unix time" to times.tsv; the last step prints the gaps.
      - name: Start timer
        shell: bash
        run: printf 'start\t\t%s\n' "$(date +%s)" > "$RUNNER_TEMP/times.tsv"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          printf 'Checkout and toolchain\t\t%s\n' "$(date +%s)" >> "$RUNNER_TEMP/times.tsv"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: rust-cache
        with:
          shared-key: ${{ matrix.artifact }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Mark Rust cache
        shell: bash
        run: printf 'Rust cache\t%s\t%s\n' '${{ steps.rust-cache.outputs.cache-hit }}' "$(date +%s)" >> "$RUNNER_TEMP/times.tsv"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cmake pkg-config libssl-dev libwayland-dev libxkbcommon-dev
      - name: Tests
        shell: bash
        run: |
          start=$(date +%s)
          cargo test --locked --profile ci
          echo "TEST_SECONDS=$(($(date +%s) - start))" >> "$GITHUB_ENV"
          printf 'Dependencies and tests\t\t%s\n' "$(date +%s)" >> "$RUNNER_TEMP/times.tsv"

      # Packaging (not on pull requests): llama-server is downloaded (or, for Intel macOS, built) once per llama.cpp
      # tag and kept in the Actions cache (the key hashes the fetch scripts, which pin the tag).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llama-cache
        if: env.PACKAGE == 'true'
        with:
          path: .llama/${{ matrix.artifact }}
          key: llama-${{ matrix.artifact }}-${{ hashFiles('scripts/fetch-llama.*') }}
      - name: Mark llama cache
        if: env.PACKAGE == 'true'
        shell: bash
        run: printf 'llama.cpp cache\t%s\t%s\n' '${{ steps.llama-cache.outputs.cache-hit }}' "$(date +%s)" >> "$RUNNER_TEMP/times.tsv"
      - name: Package Windows
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Package Linux / macOS
        if: env.PACKAGE == 'true' && runner.os != 'Windows'
        run: bash scripts/package.sh
      - name: Check macOS minimum version
        if: env.PACKAGE == 'true' && runner.os == 'macOS'
        run: bash scripts/package.sh --check-minos
      # upload-artifact drops Unix file modes and replaces symlinks, so zip dist first (as release.yml does).
      - name: Zip package (Windows)
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location dist
          7z a -tzip -mx=7 "../kyttu-ai-${{ matrix.artifact }}.zip" *
          if ($LASTEXITCODE -ne 0) { throw 'zip failed' }
          Pop-Location
      - name: Zip package (Linux / macOS)
        if: env.PACKAGE == 'true' && runner.os != 'Windows'
        run: (cd dist && zip -qry "../kyttu-ai-${{ matrix.artifact }}.zip" .)
      - name: Mark package
        if: env.PACKAGE == 'true'
        shell: bash
        run: printf 'Package and zip\t\t%s\n' "$(date +%s)" >> "$RUNNER_TEMP/times.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PACKAGE == 'true'
        with:
          name: kyttu-ai-${{ matrix.artifact }}
          path: kyttu-ai-*.zip
          if-no-files-found: error
          retention-days: 14
      # Nightly: the same zip under its rolling name. publish-checksums adds the checksums and the release body once
      # all five are up. The in-app updater (channel "nightly") depends on this name.
      - name: Publish nightly package
        if: env.NIGHTLY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nightly
          cp "kyttu-ai-${{ matrix.artifact }}.zip" "nightly/kyttu-ai-nightly-${{ matrix.artifact }}.zip"
          bash scripts/nightly.sh "nightly/kyttu-ai-nightly-${{ matrix.artifact }}.zip"
          printf 'Nightly upload\t\t%s\n' "$(date +%s)" >> "$RUNNER_TEMP/times.tsv"
      - name: Job summary
        if: always()
        shell: bash
        run: |
          bash scripts/package.sh --summary
          if [[ -f "$RUNNER_TEMP/times.tsv" ]]; then
            {
              printf '\n#### Build times (%s)\n\n| Step | OS | Cache hit | Elapsed |\n|---|---|---|---|\n' "$KYTTU_ARTIFACT"
              awk -F'\t' -v os="$RUNNER_OS" 'NR == 1 { prev = $3; next }
                { hit = ($2 == "true" ? "yes" : ($2 == "false" ? "no" : "-"))
                  printf "| %s | %s | %s | %d s |\n", $1, os, hit, $3 - prev; prev = $3 }' "$RUNNER_TEMP/times.tsv"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          fi

  # Pushes to main only: SHA256SUMS.txt for the five nightly zips, and the release body ("commit: <sha>") that the
  # in-app updater compares with its own build. Written last, so the body never points at files not yet uploaded.
  publish-checksums:
    needs: [native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kyttu-ai-*
          merge-multiple: true
          path: packages
      - name: Checksums and release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          [[ $(ls kyttu-ai-*.zip | wc -l) -eq 5 ]] || { echo "::error::expected 5 zip packages"; exit 1; }
          for f in kyttu-ai-*.zip; do mv "$f" "kyttu-ai-nightly-${f#kyttu-ai-}"; done
          sha256sum kyttu-ai-nightly-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          bash scripts/nightly.sh --finalize packages/SHA256SUMS.txt
          {
            echo '### Nightly'
            echo
            echo "Published \`${GITHUB_SHA}\` to the [nightly release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/nightly)."
          } >> "$GITHUB_STEP_SUMMARY"
