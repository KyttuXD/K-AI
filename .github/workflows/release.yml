name: Release
# Push a tag such as v0.3.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.artifact }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libssl-dev
      - run: cargo test --locked
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1
          Compress-Archive -Path dist/* -DestinationPath "kyttu-ai-${{ env.TAG }}-${{ matrix.artifact }}.zip"
      - name: Package Linux / macOS
        if: runner.os != 'Windows'
        run: |
          bash scripts/package.sh
          # zip -y keeps symlinks inside the macOS .app bundle intact.
          (cd dist && zip -qry "../kyttu-ai-${TAG}-${{ matrix.artifact }}.zip" .)
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.artifact }}
          path: kyttu-ai-*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum kyttu-ai-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            kyttu-ai-*.zip
            SHA256SUMS.txt
