name: Release
# Push a tag such as v0.3.0 to build every platform and publish a GitHub release.
# verify: the tag matches Cargo.toml's version, fmt, clippy and cargo-deny. package: tests and the release build
# (thin LTO) on each system, llama-server bundled, zipped as kyttu-ai-<tag>-<artifact>.zip. publish: only after both,
# with SHA256SUMS.txt. The in-app updater (src/core/update.rs) depends on these asset names.
# Release builds use their own Rust cache: run this workflow by hand from main (with the tag) to save it for later tags,
# since caches saved by a tag's run are visible to that tag only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: The tag is the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "$TAG" == "v$version" ]] || { echo "::error::tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: false
      - name: Linux native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          rust-version: '1.99.1'

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x64
            os: windows-2025
          - artifact: linux-x64
            os: ubuntu-24.04
          - artifact: linux-arm64
            os: ubuntu-24.04-arm
          - artifact: macos-x64
            os: macos-15-intel
            macos_min: '10.13'
          - artifact: macos-arm64
            os: macos-15
            macos_min: '11.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      KYTTU_PROFILE: release
      KYTTU_ARTIFACT: ${{ matrix.artifact }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.artifact }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      # The same profile as the package, so the tests and the app share one build of the dependencies.
      - run: cargo test --locked --release
      # Shared with build.yml's main runs, which usually fetched or built it already.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .llama/${{ matrix.artifact }}
          key: llama-${{ matrix.artifact }}-${{ hashFiles('scripts/fetch-llama.*') }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1
          Push-Location dist
          7z a -tzip -mx=7 "../kyttu-ai-$($env:TAG)-${{ matrix.artifact }}.zip" *
          if ($LASTEXITCODE -ne 0) { throw 'zip failed' }
          Pop-Location
      - name: Package Linux / macOS
        if: runner.os != 'Windows'
        run: |
          bash scripts/package.sh
          # zip -y keeps symlinks (the .app bundle, versioned .so files) intact.
          (cd dist && zip -qry "../kyttu-ai-${TAG}-${{ matrix.artifact }}.zip" .)
      - name: Check macOS minimum version
        if: runner.os == 'macOS'
        run: bash scripts/package.sh --check-minos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: kyttu-ai-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: |
          ls -l kyttu-ai-*.zip
          [[ $(ls kyttu-ai-*.zip | wc -l) -eq 5 ]] || { echo "::error::expected 5 packages"; exit 1; }
          sha256sum kyttu-ai-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          # A tag like v0.3.0-rc.1 is a pre-release, which the in-app updater skips.
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            kyttu-ai-*.zip
            SHA256SUMS.txt
